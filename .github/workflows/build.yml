name: Build NekoArchive
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download dependencies
      shell: cmd
      run: |
        mkdir C:\deps
        cd C:\deps
        echo Downloading OpenSSL...
        powershell -Command "(New-Object System.Net.ServicePointManager).SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; Invoke-WebRequest -Uri 'https://github.com/slproweb/opensslhashes/releases/download/1.1.1w/Win64OpenSSL_Light-1_1_1w.zip' -OutFile 'openssl.zip' -ErrorAction Stop"
        powershell -Command "Expand-Archive -Path 'openssl.zip' -DestinationPath 'openssl' -Force"

    - name: Configure CMake (CLI only, no Qt)
      run: |
        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DOPENSSL_ROOT_DIR="C:/deps/openssl" `
          -DOPENSSL_INCLUDE_DIR="C:/deps/openssl/include" `
          -DOPENSSL_CRYPTO_LIBRARY="C:/deps/openssl/lib/libcrypto.lib" `
          -DOPENSSL_SSL_LIBRARY="C:/deps/openssl/lib/libssl.lib"
    
    - name: Build
      run: cmake --build build --config Release

    - name: Copy DLLs
      run: |
        Copy-Item "C:\deps\openssl\bin\*.dll" build\Release\ -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NekoArchive
        path: build/Release
