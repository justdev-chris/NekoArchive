name: Build NekoArchive

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg" >> $env:GITHUB_ENV
        echo "$env:GITHUB_WORKSPACE/vcpkg" >> $env:GITHUB_PATH

    - name: Install dependencies
      run: |
        cd vcpkg
        .\vcpkg install zstd:x64-windows
        .\vcpkg install liblzma:x64-windows
        .\vcpkg install openssl:x64-windows
        .\vcpkg install xxhash:x64-windows
        .\vcpkg install qtbase:x64-windows
        .\vcpkg install qttools:x64-windows

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Collect DLLs
      shell: pwsh
      run: |
        mkdir deploy
        cd build/Release

        Copy-Item nekocli.exe ../../deploy/
        Copy-Item nekogui.exe ../../deploy/

        $dlls = Get-ChildItem -Recurse "$env:VCPKG_ROOT/packages" -Filter *.dll
        foreach ($dll in $dlls) {
            Copy-Item $dll.FullName ../../deploy/ -ErrorAction SilentlyContinue
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NekoArchive-Windows
        path: deploy/*
