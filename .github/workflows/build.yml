name: Build NekoArchive

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup vcpkg (artifacts mode)
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        ./bootstrap-vcpkg.bat -disableMetrics -useVcpkgArtifacts
        echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg" >> $env:GITHUB_ENV
        echo "$env:GITHUB_WORKSPACE/vcpkg" >> $env:GITHUB_PATH

    - name: Install vcpkg artifacts
      run: |
        cd vcpkg
        ./vcpkg x-update-baseline
        ./vcpkg x-install

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Collect DLLs
      shell: pwsh
      run: |
        mkdir deploy
        cd build/Release

        Copy-Item nekocli.exe ../../deploy/
        Copy-Item nekogui.exe ../../deploy/

        $dlls = Get-ChildItem -Recurse "$env:VCPKG_ROOT/artifacts" -Filter *.dll
        foreach ($dll in $dlls) {
            Copy-Item $dll.FullName ../../deploy/ -ErrorAction SilentlyContinue
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NekoArchive-Windows
        path: deploy/*
