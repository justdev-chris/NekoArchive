name: Build NekoArchive

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg" >> $env:GITHUB_ENV
        echo "$env:GITHUB_WORKSPACE/vcpkg" >> $env:GITHUB_PATH
    
    - name: Install dependencies
      run: |
        cd vcpkg
        .\vcpkg install zstd:x64-windows
        .\vcpkg install liblzma:x64-windows
        .\vcpkg install openssl:x64-windows
        .\vcpkg install xxhash:x64-windows
        .\vcpkg install qtbase:x64-windows
        .\vcpkg install qttools:x64-windows
    
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
    
    - name: Build
      run: |
        cd build
        cmake --build . --config Release
    
    - name: Collect DLLs
      shell: cmd
      run: |
        mkdir deploy
        cd build/Release
        
        copy nekocli.exe ..\..\deploy\
        copy nekogui.exe ..\..\deploy\
        
        copy "%VCPKG_ROOT%\packages\qtbase_x64-windows\bin\Qt6Core.dll" ..\..\deploy\
        copy "%VCPKG_ROOT%\packages\qtbase_x64-windows\bin\Qt6Gui.dll" ..\..\deploy\
        copy "%VCPKG_ROOT%\packages\qtbase_x64-windows\bin\Qt6Widgets.dll" ..\..\deploy\
        
        copy "%VCPKG_ROOT%\packages\zstd_x64-windows\bin\zstd.dll" ..\..\deploy\
        copy "%VCPKG_ROOT%\packages\openssl_x64-windows\bin\libcrypto-3-x64.dll" ..\..\deploy\
        copy "%VCPKG_ROOT%\packages\openssl_x64-windows\bin\libssl-3-x64.dll" ..\..\deploy\
        copy "%VCPKG_ROOT%\packages\liblzma_x64-windows\bin\liblzma.dll" ..\..\deploy\
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NekoArchive-Windows
        path: deploy/*
