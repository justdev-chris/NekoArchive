name: Build NekoArchive

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # -----------------------------
    # Install Qt (prebuilt)
    # -----------------------------
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install aqtinstall
      run: pip install aqtinstall

    - name: Install Qt 6.6.3 MSVC64
      run: |
        aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 --outputdir C:\Qt

    - name: Set Qt env
      run: echo "QT_DIR=C:\Qt\6.6.3\msvc2019_64" >> $env:GITHUB_ENV

    # -----------------------------
    # Install vcpkg (workspace path)
    # -----------------------------
    - name: Clone vcpkg
      run: git clone https://github.com/microsoft/vcpkg $env:GITHUB_WORKSPACE/vcpkg

    - name: Bootstrap vcpkg
      run: $env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat

    - name: Install dependencies via vcpkg
      run: |
        $env:GITHUB_WORKSPACE/vcpkg/vcpkg install openssl:x64-windows zstd:x64-windows liblzma:x64-windows xxhash:x64-windows
        echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg" >> $env:GITHUB_ENV

    # -----------------------------
    # Configure & Build
    # -----------------------------
    - name: Configure CMake
      run: |
        cmake -B build -S . ^
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake ^
          -DQt6_DIR=${{ env.QT_DIR }}/lib/cmake/Qt6

    - name: Build
      run: cmake --build build --config Release

    # -----------------------------
    # Artifact
    # -----------------------------
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NekoArchive
        path: build/Release
