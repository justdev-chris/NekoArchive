name: Build NKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create output directory
      run: mkdir -p output
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qemu-system-x86 \
          qemu-utils \
          xorriso \
          mtools \
          dosfstools \
          gcc \
          make \
          git \
          curl \
          bzip2 \
          xz-utils
    
    - name: Build NKS
      run: |
        make all
        ls -la output/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nks-images
        path: output/
