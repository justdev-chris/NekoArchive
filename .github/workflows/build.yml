name: Build NekoArchive
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # -----------------------------
    # Install Qt
    # -----------------------------
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install aqtinstall
      run: pip install aqtinstall

    - name: Install Qt 6.6.3 MSVC64
      run: |
        aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 --outputdir C:\Qt

    - name: Set Qt env
      run: echo "QT_DIR=C:\Qt\6.6.3\msvc2019_64" >> $env:GITHUB_ENV

    # -----------------------------
    # Install OpenSSL (Chocolatey)
    # -----------------------------
    - name: Install OpenSSL via Chocolatey
      run: |
        choco install openssl -y

    # Verify OpenSSL installation
    - name: Verify OpenSSL installation
      run: |
        Write-Host "OpenSSL version:"
        openssl version
        Write-Host "Searching for OpenSSL libs..."
        Get-ChildItem "C:\Program Files\OpenSSL-Win64\lib" -Include "*.lib" | Select-Object Name

    # -----------------------------
    # Install vcpkg
    # -----------------------------
    - name: Clone vcpkg
      run: git clone https://github.com/microsoft/vcpkg $env:GITHUB_WORKSPACE\vcpkg

    - name: Bootstrap vcpkg
      run: |
        & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat"

    - name: Install small libs via vcpkg
      run: |
        & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe" install zstd:x64-windows liblzma:x64-windows xxhash:x64-windows
        echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV

    # -----------------------------
    # Configure & Build
    # -----------------------------
    - name: Configure CMake
      run: |
        cmake -B build -S . `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_CMAKE_SYSTEM_IGNORE_EXTERNAL_OPENSSL=ON `
          -DVCPKG_MANIFEST_MODE=OFF `
          -DVCPKG_TARGET_TRIPLET="x64-windows" `
          -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL-Win64" `
          -DOPENSSL_INCLUDE_DIR="C:/Program Files/OpenSSL-Win64/include" `
          -DOPENSSL_CRYPTO_LIBRARY="C:/Program Files/OpenSSL-Win64/lib/libcrypto.lib" `
          -DOPENSSL_SSL_LIBRARY="C:/Program Files/OpenSSL-Win64/lib/libssl.lib" `
          -DQt6_DIR="${{ env.QT_DIR }}\lib\cmake\Qt6"
    
    - name: Build
      run: cmake --build build --config Release

    # -----------------------------
    # Copy DLLs (Qt + OpenSSL)
    # -----------------------------
    - name: Copy Qt + OpenSSL DLLs
      run: |
        Copy-Item "$env:QT_DIR\bin\*.dll" build\Release\
        New-Item -ItemType Directory -Force -Path build\Release\platforms
        Copy-Item "$env:QT_DIR\plugins\platforms\*" build\Release\platforms -Recurse
        Copy-Item "C:/Program Files/OpenSSL-Win64/bin/libcrypto-3-x64.dll" build\Release\
        Copy-Item "C:/Program Files/OpenSSL-Win64/bin/libssl-3-x64.dll" build\Release\

    # -----------------------------
    # Artifact
    # -----------------------------
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NekoArchive
        path: build/Release
