name: Build NekoArchive
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone vcpkg
      run: git clone https://github.com/microsoft/vcpkg ${{ github.workspace }}/vcpkg

    - name: Download Tiny-AES-C
      run: |
        mkdir -p include/nekoarchive/crypto
        curl.exe -L -o include/nekoarchive/crypto/aes.h https://raw.githubusercontent.com/kokke/tiny-AES-c/master/aes.h
        mkdir -p src/crypto
        curl.exe -L -o src/crypto/aes.c https://raw.githubusercontent.com/kokke/tiny-AES-c/master/aes.c

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NekoArchive
        path: build/Release
