name: Build NekoArchive
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Install Qt
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install aqtinstall
      run: pip install aqtinstall

    - name: Install Qt 6.6.3 MSVC64
      run: aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 --outputdir C:\Qt

    - name: Set Qt env
      run: echo "QT_DIR=C:\Qt\6.6.3\msvc2019_64" >> $env:GITHUB_ENV

    # Download ALL libraries as ZIP files only (no installers)
    - name: Download OpenSSL (ZIP)
      run: |
        mkdir C:\deps
        $url = "https://github.com/slproweb/opensslhashes/releases/download/1.1.1w/Win64OpenSSL_Light-1_1_1w.zip"
        curl.exe -L -o C:\deps\openssl.zip $url
        Expand-Archive -Path C:\deps\openssl.zip -DestinationPath C:\deps\openssl -Force
        dir C:\deps\openssl

    - name: Download zstd (ZIP)
      run: |
        $url = "https://github.com/facebook/zstd/releases/download/v1.5.5/zstd-v1.5.5-win64.zip"
        curl.exe -L -o C:\deps\zstd.zip $url
        Expand-Archive -Path C:\deps\zstd.zip -DestinationPath C:\deps\zstd -Force
        dir C:\deps\zstd

    - name: Download liblzma (ZIP)
      run: |
        $url = "https://github.com/tukaani-project/xz/releases/download/v5.4.4/xz-5.4.4-windows.zip"
        curl.exe -L -o C:\deps\liblzma.zip $url
        Expand-Archive -Path C:\deps\liblzma.zip -DestinationPath C:\deps\liblzma -Force
        dir C:\deps\liblzma

    - name: Download xxHash (ZIP)
      run: |
        $url = "https://github.com/Cyan4973/xxHash/releases/download/v0.8.1/xxHash-0.8.1-win64.zip"
        curl.exe -L -o C:\deps\xxhash.zip $url
        Expand-Archive -Path C:\deps\xxhash.zip -DestinationPath C:\deps\xxhash -Force
        dir C:\deps\xxhash

    # Configure & Build
    - name: Configure CMake
      run: |
        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DOPENSSL_ROOT_DIR="C:/deps/openssl" `
          -DOPENSSL_INCLUDE_DIR="C:/deps/openssl/include" `
          -DOPENSSL_CRYPTO_LIBRARY="C:/deps/openssl/lib/libcrypto.lib" `
          -DOPENSSL_SSL_LIBRARY="C:/deps/openssl/lib/libssl.lib" `
          -DQt6_DIR="${{ env.QT_DIR }}\lib\cmake\Qt6"
    
    - name: Build
      run: cmake --build build --config Release

    # Copy runtime DLLs
    - name: Copy DLLs
      run: |
        Copy-Item "$env:QT_DIR\bin\*.dll" build\Release\ -Force
        Copy-Item "C:\deps\openssl\bin\*.dll" build\Release\ -Force
        New-Item -ItemType Directory -Force -Path build\Release\platforms
        Copy-Item "$env:QT_DIR\plugins\platforms\*" build\Release\platforms -Recurse -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NekoArchive
        path: build/Release
